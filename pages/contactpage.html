<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Classic Timepieces - Get in touch about our vintage watches">
    <meta name="keywords" content="contact, vintage watches, timepiece service, watch repair">
    <title>Contact - Classic Timepieces</title>
    <script src="/Js-Files/navScript.js" defer></script>
    <script src="/Js-Files/contact.js" defer></script>
    
    <link rel="stylesheet" href="/css/mainStyle.css">
    <link rel="stylesheet" href="/css/contact.css">
</head>
<body>
    <header id="main-header"> 
        
    </header>
    <main id="main-body">
        <form id="form">
            <div>
            <fieldset id="detail">
                <legend>Your Details</legend>
                <div id="name">
                    <label for="Name">Your Name:</label>
                    <input type="text" id="Name" ><br>
                    <span class="error" id="nameError"></span><br>
                </div>
                <div id="email">
                    <label for="Email">Email:</label>
                    <input type="email" id="Email"><br>
                    <span class="error" id="emailError"></span><br>
                </div>
                <div id="phone-number">
                    <label for="Phone-number">Phone Number: </label>
                    <input type="text" id="Phone-number" >
                </div>
            </fieldset>
        </div>
        <div>
            <fieldset id="msg">
                <legend>Write A Message To Us</legend>
                <div id="message">
                    <label for="Message">Your Message:</label>
                    <textarea id="Message" placeholder="Complaints or compliments, they both go a long way"></textarea>
                </div>
            </fieldset>
        </div>
            <button type="submit" id="btn-submit">Submit</button>
        
        </form>

    </main>

    <footer id="main-footer">
        
    </footer>


    
</body>
</html>
